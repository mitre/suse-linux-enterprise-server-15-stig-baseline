### INPUTS ###
# Inputs are variables that can be referenced by any control in the profile,
# and are defined and given a default value in this file.

# By default, each parameter is set to exactly comply with the profile baseline
# wherever possible. Some profile controls will require a unique value reflecting
# the necessary context for the supporting system.

# Values provided here can be overridden using an input file or a CLI flag at
# execution time. See InSpec's Inputs docs at https://docs.chef.io/inspec/profiles/inputs/
# for details.

# NOTE: DO NOT directly change the default values by editing this file. Use
# overrides instead.
###

inputs:
  # SV-234853, SV-234877, SV-234878
  - name: sudoers_config_files
    description: 'The files and directories you keep your sudoers configs'
    type: Array
    value:
      - '/etc/sudoers'
      - '/etc/sudoers.d/*'

  # (unused — no controls reference this input)
  - name: passwordless_admins
    description: List of administrative groups permitted by ISSO to have NOPASSWD set in sudoers files
    type: Array
    value: []

  # SV-234827
  - name: sshd_config_values
    description: 'The agreed sshd server config values for the organization'
    type: Hash
    value:
      GSSAPIAuthentication: 'no'
      ClientAliveInterval: '600'

  # SV-234817, SV-234855, SV-234869
  - name: alternate_mfa_method
    description: Name of the MFA method in place on the system (leave blank if using the default SSSD, give the name if using an approved alternate method)
    type: String
    value: ''

  # SV-234855
  - name: sssd_conf_files
    description: File and directory globs to check for SSSD configuration
    type: Array
    value:
      - /etc/sssd/sssd.conf
      - /etc/sssd/conf.d/*.conf

  # SV-235008, SV-235009
  - name: ssh_host_key_dirs
    description: Directories where public host SSH keys for the server are stored
    type: Array
    value:
      - /etc/ssh/
      - /home/

  # SV-234832, SV-234833, SV-234835, SV-234959, SV-234993, SV-234995, SV-235008,
  # SV-235009, SV-235030
  - name: file_modes
    description: >-
      File-permission policy, split by semantics so a key can never silently mean
      "<=" in one control and "==" in another. "max" entries are ceilings: a file
      may be equal to or MORE restrictive than the octet, never less. "exact"
      entries must match the octet exactly (or be declared as such, as in
      /etc/permissions.local). "umask" holds shell umask values, not file modes.
    type: Hash
    value:
      max:
        ssh_pub_key: '0644'
        ssh_private_key: '0640'
        audit_conf: '0640'
        audit_tool: '0755'
        log_files: '0640'
        init_files: '0740'
        system_libs: '0755'
        home_dirs: '0750'
      exact:
        /var/log/audit: '0600'
        /var/log/audit/audit.log: '0600'
        /etc/audit/audit.rules: '0640'
        /etc/audit/rules.d/audit.rules: '0640'
        cron_dirs: '0700'
        /etc/group: '0644'
        /etc/group-: '0644'
        /etc/gshadow: '0000'
        /etc/gshadow-: '0000'
        /etc/passwd: '0644'
        /etc/passwd-: '0644'
        /etc/shadow: '0000'
        /etc/shadow-: '0000'
        /etc/crontab: '0600'
        /etc/ssh/sshd_config: '0600'
        auditd_conf: '0640'
      umask:
        default: '077'
        bashrc: '077'
        cshrc: '077'
        profile: '077'

  - name: network_failure_actions
    description: Permitted values for network_failure_action in /etc/audit/audisp-remote.conf. Defaults to all three STIG-acceptable actions; narrow to a single value to require a specific one.
    type: Array
    value:
      - syslog
      - single
      - halt
