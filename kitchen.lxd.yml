---
platforms:
  - name: sles-15

driver:
  name: proxy
  host: <%= ENV.fetch("KITCHEN_HOST") %>
  username: <%= ENV.fetch("LXD_VM_USERNAME", "sles") %>
  ssh_key: <%= ENV.fetch("KITCHEN_SSH_KEY") %>

provisioner:
  name: ansible_playbook
  hosts: all
  require_chef_for_busser: false
  require_ruby_for_busser: false
  # Do NOT let kitchen-ansible install Ansible: its built-in SUSE installer
  # targets openSUSE Leap 15.2 + Python 2. We provision Python 3.11 + a modern
  # ansible-core ourselves in pre_converge (the system python3 is 3.6, which
  # can't parse current community.general modules) and point Kitchen at it.
  require_ansible_repo: false
  require_ansible_omnibus: false
  require_ansible_source: false
  require_pip: false
  require_pip3: false
  ansible_binary_path: /opt/ansible-venv/bin
  ansible_connection: local
  # kitchen-ansible has no ansible_python_interpreter key; inject it as an extra
  # var so modules run under 3.11 instead of the system 3.6.
  extra_vars:
    ansible_python_interpreter: /usr/bin/python3.11
  ansible_verbose: true
  roles_path: spec/ansible/roles
  galaxy_ignore_certs: true
  requirements_path: spec/ansible/roles/requirements.yml
  requirements_collection_path: spec/ansible/roles/requirements.yml
  ansible_extra_flags: <%= ENV['ANSIBLE_EXTRA_FLAGS'] %>

suites:
  - name: vanilla
    provisioner:
      playbook: spec/ansible/roles/ansible-role-sles-vanilla.yml
    driver:
      tags:
        Name: Vanilla-<%= ENV['USER'] %>
        CreatedBy: test-kitchen

  - name: hardened
    provisioner:
      playbook: spec/ansible/roles/ansible-role-sles-hardened.yml
    driver:
      tags:
        Name: Hardened-<%= ENV['USER'] %>
        CreatedBy: test-kitchen

lifecycle:
  pre_converge:
    - remote: |
        echo "+++ Registering with SCC (if a regcode was provided) +++"
        # The default openSUSE Leap image already has working repos, so this is a
        # no-op there. It exists for the genuine-SLES path: a SLES image has no
        # repos enabled until registered, so the LXD launch step writes
        # /etc/scc-regcode.env via cloud-init when SCC_REGCODE is set, and we
        # register here. Skipped automatically when the regcode is absent.
        [ -f /etc/scc-regcode.env ] && . /etc/scc-regcode.env
        if [ -n "${SCC_REGCODE:-}" ]; then
          sudo SUSEConnect -r "$SCC_REGCODE" || true
          sudo SUSEConnect -p sle-module-python3/15.6/x86_64 || true
          sudo SUSEConnect -p sle-module-basesystem/15.6/x86_64 || true
        else
          echo "SCC_REGCODE not set; assuming repositories are already configured."
        fi
        echo "+++ Refreshing and updating Zypper packages +++"
        sudo zypper --non-interactive --gpg-auto-import-keys refresh || true
        sudo zypper --non-interactive update || true
        echo ""
        echo "+++ Installing needed packages + Python 3.11 +++"
        # python311 is in Leap's default OSS repo (no registration); on SLES the
        # SUSEConnect sle-module-python3 step above provides it. /usr/bin/python3
        # stays 3.6; 3.11 lives at /usr/bin/python3.11.
        sudo zypper --non-interactive install -y bc bind-utils vim git wget gcc libffi-devel libopenssl-devel python311 python311-pip || true
        echo ""
        echo "+++ Installing a modern ansible-core in a Python 3.11 virtualenv +++"
        # Build the Ansible controller in a dedicated 3.11 venv: deterministic
        # binary path for kitchen-ansible, sidesteps PEP-668 externally-managed,
        # and ansible-core 2.18 is the floor for current community.general.
        sudo python3.11 -m venv /opt/ansible-venv
        sudo /opt/ansible-venv/bin/pip install --upgrade pip
        sudo /opt/ansible-venv/bin/pip install "ansible-core>=2.18,<2.19"
        # kitchen-ansible runs ansible-galaxy as a bare command (PATH lookup),
        # not via ansible_binary_path, so expose the venv binaries on PATH.
        sudo ln -sf /opt/ansible-venv/bin/ansible /opt/ansible-venv/bin/ansible-playbook /opt/ansible-venv/bin/ansible-galaxy /opt/ansible-venv/bin/ansible-doc /opt/ansible-venv/bin/ansible-config /usr/local/bin/
        echo ""
        echo "+++ Keeping the kitchen sudo user usable after the hardening phase +++"
        sudo chage -d $(( $( date +%s ) / 86400 )) <%= ENV.fetch("LXD_VM_USERNAME", "sles") %> || true
        echo ""
        echo "+++ add cinc-auditor for local shell +++"
        curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor

transport:
  name: ssh
  username: <%= ENV.fetch("LXD_VM_USERNAME", "sles") %>
  ssh_key: <%= ENV.fetch("KITCHEN_SSH_KEY") %>
  # https://github.com/neillturner/kitchen-ansible/issues/295
  max_ssh_sessions: 2
