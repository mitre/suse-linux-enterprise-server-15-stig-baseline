name: SLES 15 LXD VM Testing Matrix

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate my profile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CHEF_LICENSE: accept-silent
      CHEF_LICENSE_KEY: ${{ secrets.SAF_CHEF_LICENSE_KEY }}
      KITCHEN_LOCAL_YAML: kitchen.lxd.yml
      PLATFORM: "sles-15"
      LC_ALL: "en_US.UTF-8"
      LXD_VM_USERNAME: "sles"
      # SCC registration code. Not needed for the default openSUSE Leap image
      # (open repos). Required only when SLES_IMAGE_URL points at a genuine SLES
      # image, which has no repos enabled until registered.
      SCC_REGCODE: ${{ secrets.SCC_REGCODE }}
      # Override the base image. Unset = openSUSE Leap 15.6. Set to an SCC
      # registered / mirrored SLES 15 qcow2 (with SCC_REGCODE) for a real target.
      SLES_IMAGE_URL: ${{ vars.SLES_IMAGE_URL }}
    strategy:
      matrix:
        suite: ["vanilla", "hardened"]
      fail-fast: false
    steps:
      - name: Install host packages
        run: sudo apt-get update && sudo apt-get -y install jq qemu-utils gdisk libguestfs-tools

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install and configure LXD
        run: sudo ./.github/scripts/setup-lxd.sh

      - name: Set short git commit SHA
        run: echo "COMMIT_SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install gems and vendor profile
        run: |
          bundle install
          bundle exec cinc-auditor vendor . --overwrite

      - name: Generate ephemeral SSH keypair for Kitchen
        run: |
          set -euo pipefail
          # The VM and runner are both torn down at job end, and we bake the public
          # key into the image offline (next steps), so we control both halves at
          # runtime. A throwaway keypair generated here is all Kitchen needs to SSH
          # to the VM over the private LXD NAT bridge -- no long-lived secret.
          KEY="$RUNNER_TEMP/kitchen_key"
          ssh-keygen -t ed25519 -N '' -C "kitchen-ci-ephemeral" -f "$KEY"
          echo "KITCHEN_SSH_KEY=$KEY" >> "$GITHUB_ENV"
          echo "KITCHEN_SSH_PUB=$KEY.pub" >> "$GITHUB_ENV"

      - name: Download base image QCOW2
        # Defaults to openSUSE Leap 15.6; override with the SLES_IMAGE_URL variable
        # (+ SCC_REGCODE) to target genuine SLES 15. See fetch-sles-image.sh.
        run: ./.github/scripts/fetch-sles-image.sh sles-image.qcow2

      - name: Repackage QCOW2 with grown disk and fixed GPT for LXD
        run: |
          set -euo pipefail
          qemu-img convert -O raw sles-image.qcow2 disk.raw
          qemu-img resize disk.raw +16M
          sgdisk -e disk.raw
          qemu-img convert -O qcow2 disk.raw disk.qcow2

      - name: Bake Kitchen login user + key into the image
        run: |
          set -euo pipefail
          # Generic cloud images can't receive LXD's cloud-init.user-data: LXD
          # delivers it through the lxd-agent over vsock, which these images don't
          # ship. So provision the Kitchen login user offline with virt-customize
          # instead of relying on cloud-init at boot.
          export LIBGUESTFS_BACKEND=direct
          # libguestfs/supermin builds its appliance by READING the host kernel,
          # but GitHub runners ship /boot/vmlinuz-* mode 0600 (root-only), which
          # makes supermin fail with "exited with error status 1". Make it readable.
          sudo chmod 0644 /boot/vmlinuz-* || true
          U='${{ env.LXD_VM_USERNAME }}'
          virt-customize -a disk.qcow2 \
            --run-command "useradd -m -s /bin/bash -G users $U || true" \
            --run-command "printf '%s ALL=(ALL) NOPASSWD:ALL\n' '$U' > /etc/sudoers.d/99-kitchen && chmod 0440 /etc/sudoers.d/99-kitchen" \
            --run-command "systemctl enable sshd.service || true"
          virt-customize -a disk.qcow2 --ssh-inject "$U:file:$KITCHEN_SSH_PUB"
          if [ -n "${SCC_REGCODE:-}" ]; then
            virt-customize -a disk.qcow2 \
              --write "/etc/scc-regcode.env:SCC_REGCODE=$SCC_REGCODE" \
              --run-command 'chmod 0600 /etc/scc-regcode.env'
          fi

      - name: Import image into LXD
        run: |
          set -euo pipefail
          cat > metadata.yaml <<EOF
          architecture: x86_64
          creation_date: $(date +%s)
          properties:
            description: "SLES 15 STIG test target"
            os: "opensuse"
            release: "15.6"
          type: virtual-machine
          EOF
          tar -cf metadata.tar metadata.yaml
          lxc image import metadata.tar disk.qcow2 --alias stig-target

      - name: Launch and wait for VM
        run: |
          set -euo pipefail
          NAME="${{ matrix.suite }}-${{ env.PLATFORM }}"
          # The login user + key + (optional) SCC env are already baked into the
          # image, so a plain launch is all that is needed.
          lxc launch stig-target "$NAME" --vm -c limits.memory=4GiB

          for i in $(seq 1 30); do
            lxc list --format=csv | grep -q "$NAME.*RUNNING" && break
            sleep 10
          done
          lxc list --format=csv | grep -q "$NAME.*RUNNING" || { echo "VM never reached RUNNING"; lxc info "$NAME"; exit 1; }

      - name: Export VM IPv4 for Kitchen
        run: |
          set -euo pipefail
          NAME="${{ matrix.suite }}-${{ env.PLATFORM }}"
          for i in $(seq 1 24); do
            ipv4=$(lxc list "$NAME" --format=json | jq -r '.[0].state.network | to_entries[] | .value.addresses[]? | select(.family=="inet" and .scope=="global") | .address' | head -n1)
            [ -n "$ipv4" ] && break
            sleep 5
          done
          [ -n "$ipv4" ] || { echo "No VM IPv4 found"; lxc info "$NAME"; exit 1; }
          echo "KITCHEN_HOST=$ipv4" >> "$GITHUB_ENV"

      - name: VM boot diagnostics
        continue-on-error: true
        run: |
          NAME="${{ matrix.suite }}-${{ env.PLATFORM }}"
          # Give the guest a moment to settle, then dump the serial console so we
          # can see boot / user-provisioning state if SSH later fails.
          sleep 20
          echo "=== lxc info ==="; lxc info "$NAME" || true
          echo "=== serial console log (tail) ==="; lxc console "$NAME" --show-log 2>&1 | tail -50 || true

      - name: Run kitchen test
        run: bundle exec kitchen test --destroy=always ${{ matrix.suite }}-${{ env.PLATFORM }} || true

      - name: Save results summary JSON
        continue-on-error: true
        uses: mitre/saf_action@a19f76ed3721c14aa8a1afb8eded117d8bf16a5d  # v1.9.0
        with:
          command_string: "view summary -f json -i spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}.json -o spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}-data.json"

      - name: Upload Test Result JSON
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ${{ env.PLATFORM }}_${{ matrix.suite }}.json
          path: spec/results/

      - name: Upload to Heimdall
        continue-on-error: true
        env:
          SAF_HEIMDALL_UPLOAD_KEY: ${{ secrets.SAF_HEIMDALL_UPLOAD_KEY }}
        run: |
          curl -# -s -F data=@spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}.json \
            -F "filename=${{ env.PLATFORM }}_${{ matrix.suite }}-${{ env.COMMIT_SHORT_SHA }}.json" \
            -F "public=true" \
            -F "evaluationTags=${{ env.COMMIT_SHORT_SHA }},${{ github.repository }},${{ github.workflow }}" \
            -H "Authorization: Api-Key $SAF_HEIMDALL_UPLOAD_KEY" \
            "${{ vars.SAF_HEIMDALL_URL }}/evaluations"

      - name: Display results summary
        uses: mitre/saf_action@a19f76ed3721c14aa8a1afb8eded117d8bf16a5d  # v1.9.0
        with:
          command_string: "view summary -i spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}.json"

      - name: Generate Markdown Summary
        continue-on-error: true
        id: generate-summary
        run: |
          cat spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}-data.json | python .github/scripts/markdown-summary.py > spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}-markdown-summary.md
          cat spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}-markdown-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Validate scan threshold
        uses: mitre/saf_action@a19f76ed3721c14aa8a1afb8eded117d8bf16a5d  # v1.9.0
        with:
          command_string: "validate threshold -i spec/results/${{ env.PLATFORM }}_${{ matrix.suite }}.json -F ${{ matrix.suite }}.threshold.yml"

      - name: Cleanup SSH private key
        if: always()
        run: rm -f "$RUNNER_TEMP/kitchen_key" "$RUNNER_TEMP/kitchen_key.pub"
