---
# Pass/fail gate for the SUSE BCI "vanilla" container scan.
#
# compliance.min is 0 while the profile is stubbed. Container scans naturally
# score differently from VM scans (many host/kernel/bootloader controls are
# not applicable in a container), so tune this independently from the VM
# thresholds once controls and container-aware inputs are in place.
error.total.max: 0
compliance.min: 0
